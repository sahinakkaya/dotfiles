---
- name: Check for an existing nvm installation
  ansible.builtin.stat:
    path: "{{ nvm_dir }}/nvm.sh"
  register: nvm_script

- name: Install nvm without changing shell startup files
  when: not nvm_script.stat.exists
  block:
    - name: Find the latest nvm release
      ansible.builtin.uri:
        url: https://api.github.com/repos/nvm-sh/nvm/releases/latest
        return_content: true
      register: nvm_release
      check_mode: false

    - name: Create nvm directory
      ansible.builtin.file:
        path: "{{ nvm_dir }}"
        state: directory
        mode: "0755"

    - name: Download the versioned nvm installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_release.json.tag_name }}/install.sh"
        dest: "{{ nvm_dir }}/install.sh"
        mode: "0700"

    - name: Run nvm installer as the current user
      ansible.builtin.command: bash "{{ nvm_dir }}/install.sh"
      args:
        creates: "{{ nvm_dir }}/nvm.sh"
      environment:
        NVM_DIR: "{{ nvm_dir }}"
        PROFILE: /dev/null
        METHOD: script

- name: Install Node and select the default version
  ansible.builtin.shell: |
    set -e
    source "$NVM_DIR/nvm.sh" --no-use
    resolved="$(nvm version "$REQUESTED_NODE_VERSION" || true)"
    if [ "$resolved" = N/A ]; then
      nvm install "$REQUESTED_NODE_VERSION"
      resolved="$(nvm version "$REQUESTED_NODE_VERSION")"
      echo NODE_INSTALLED
    fi
    if [ "$(nvm version default || true)" != "$resolved" ]; then
      nvm alias default "$resolved"
      echo NODE_DEFAULT_CHANGED
    fi
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ nvm_dir }}"
    REQUESTED_NODE_VERSION: "{{ node_version }}"
  register: nvm_node_install
  changed_when: "'NODE_INSTALLED' in nvm_node_install.stdout or 'NODE_DEFAULT_CHANGED' in nvm_node_install.stdout"

---
- name: Install keymapper on Fedora
  when: ansible_facts['distribution'] == 'Fedora'
  tags: [keymapper]
  block:
    - name: Check keymapper package architecture
      ansible.builtin.assert:
        that: ansible_facts['architecture'] in keymapper_architectures
        fail_msg: "No keymapper RPM configured for this architecture."

    - name: Check installed keymapper version
      ansible.builtin.command:
        argv: [rpm, -q, --queryformat, "%{VERSION}", keymapper]
      register: keymapper_installed
      changed_when: false
      failed_when: keymapper_installed.rc not in [0, 1]
      check_mode: false

    - name: Install the official keymapper RPM
      when: keymapper_installed.rc != 0 or keymapper_installed.stdout != keymapper_version
      become: true
      ansible.builtin.dnf:
        name: "https://github.com/houmain/keymapper/releases/download/{{ keymapper_version }}/keymapper-{{ keymapper_version }}-Linux-{{ keymapper_architectures[ansible_facts['architecture']] }}.rpm"
        state: present
        # Upstream release RPMs are not signed with a Fedora trusted key.
        disable_gpg_check: true

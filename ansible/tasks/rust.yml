---
- name: Check whether Cargo is installed
  ansible.builtin.command: cargo --version
  register: cargo_check
  changed_when: false
  failed_when: false

- name: Check whether the Rust compiler is installed
  ansible.builtin.command: rustc --version
  register: rustc_check
  changed_when: false
  failed_when: false

- name: Bootstrap the Rust toolchain
  when: cargo_check.rc != 0 or rustc_check.rc != 0
  block:
    - name: Create temporary Rustup installer file
      ansible.builtin.tempfile:
        state: file
        suffix: -rustup-init.sh
      register: rustup_installer_file

    - name: Download the official Rustup installer
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: "{{ rustup_installer_file.path }}"
        mode: "0700"
        force: true

    - name: Install Rust and Cargo with Rustup
      ansible.builtin.command:
        argv:
          - sh
          - "{{ rustup_installer_file.path }}"
          - -y
          - --profile
          - minimal
          - --default-toolchain
          - stable
          - --no-modify-path

  always:
    - name: Remove the temporary Rustup installer
      ansible.builtin.file:
        path: "{{ rustup_installer_file.path }}"
        state: absent
      when: rustup_installer_file.path is defined

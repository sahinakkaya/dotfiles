---
# Build Go projects from source and expose their binaries on PATH.
- name: Install sptlrx on Linux
  when: ansible_facts['system'] == 'Linux'
  block:
    - name: Create the source repositories directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/GitRepos"
        state: directory
        mode: "0755"

    - name: Clone sptlrx without overwriting an existing checkout
      ansible.builtin.git:
        repo: https://github.com/raitonoberu/sptlrx.git
        dest: "{{ lookup('env', 'HOME') }}/GitRepos/sptlrx"
        update: false

    - name: Check whether sptlrx is built
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/GitRepos/sptlrx/sptlrx"
      register: sptlrx_binary

    - name: Build sptlrx from source
      when: not sptlrx_binary.stat.exists
      block:
        - name: Fetch sptlrx Go dependencies
          ansible.builtin.command:
            argv: [go, get]
            chdir: "{{ lookup('env', 'HOME') }}/GitRepos/sptlrx"

        - name: Compile sptlrx
          ansible.builtin.command:
            argv: [go, build, -ldflags, '-w -s']
            chdir: "{{ lookup('env', 'HOME') }}/GitRepos/sptlrx"
            creates: "{{ lookup('env', 'HOME') }}/GitRepos/sptlrx/sptlrx"

    - name: Create the user executable directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Make sptlrx available on PATH
      ansible.builtin.file:
        src: "{{ lookup('env', 'HOME') }}/GitRepos/sptlrx/sptlrx"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/sptlrx"
        state: link

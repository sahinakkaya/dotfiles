- name: Install caelestia build dependencies
  ansible.builtin.dnf:
    name:
      # caelestia
      - qt6-qtbase-devel
      - qt6-qtdeclarative-devel
      - qt6-qtshadertools-devel
      - qt6-qtmultimedia-devel
      - libqalculate-devel
      - aubio-devel

      # libcava
      - gcc
      - meson
      - ninja-build
      - pkgconf-pkg-config
      - fftw3-devel
      - iniparser-devel
      - pipewire-devel

      # sensors
      - lm_sensors-devel
 
    state: present
  become: true

- name: Clone libcava
  ansible.builtin.git:
    repo: https://github.com/LukashonakV/cava.git
    dest: "{{ ansible_env.HOME }}/.local/src/libcava"
    version: master
    update: true
  become: false

- name: Configure libcava
  ansible.builtin.command:
    argv:
      - meson
      - setup
      - build
      - --prefix=/usr/local
      - --libdir=lib64
      - -Dbuild_target=lib
    chdir: "{{ ansible_env.HOME }}/.local/src/libcava"
    creates: "{{ ansible_env.HOME }}/.local/src/libcava/build/build.ninja"
  become: false

- name: Build libcava
  ansible.builtin.command:
    cmd: meson compile -C build
    chdir: "{{ ansible_env.HOME }}/.local/src/libcava"
  become: false

- name: Install libcava
  ansible.builtin.command:
    cmd: meson install -C build --no-rebuild
    chdir: "{{ ansible_env.HOME }}/.local/src/libcava"
  become: true

- name: Register local library directory
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/libcava.conf
    content: "/usr/local/lib64\n"
    mode: "0644"
  become: true

- name: Refresh library cache
  ansible.builtin.command: ldconfig
  become: true

- name: Clone Caelestia
  ansible.builtin.git:
    repo: https://github.com/caelestia-dots/shell.git
    dest: "{{ caelestia_source_dir }}"
    version: main
    recursive: true
    update: true
  become: false

- name: Configure Caelestia
  ansible.builtin.command:
    argv:
      - cmake
      - -B
      - build
      - -G
      - Ninja
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/
      - "-DINSTALL_QSCONFDIR={{ ansible_env.HOME }}/.config/quickshell/caelestia"
    chdir: "{{ caelestia_source_dir }}"

  environment:
    PKG_CONFIG_PATH: "/usr/local/lib64/pkgconfig:{{ ansible_env.PKG_CONFIG_PATH | default('') }}"
  become: false

- name: Build Caelestia
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - build
    chdir: "{{ caelestia_source_dir }}"
  become: false

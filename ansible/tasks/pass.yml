---
- name: Create GnuPG configuration directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.gnupg"
    state: directory
    mode: "0700"

- name: Find pinentry executable
  ansible.builtin.shell: command -v pinentry
  register: pinentry_executable
  changed_when: false
  check_mode: false

- name: Configure GPG agent pinentry
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.gnupg/gpg-agent.conf"
    regexp: '^\s*pinentry-program\s+'
    line: "pinentry-program {{ pinentry_executable.stdout }}"
    create: true
    mode: "0600"
  register: gpg_agent_configuration

- name: Restart GPG agent after configuration changes
  ansible.builtin.command: gpgconf --kill gpg-agent
  when: gpg_agent_configuration.changed

- name: Clone password store
  ansible.builtin.git:
    repo: "{{ pass_git_remote }}"
    dest: "{{ pass_store_dir }}"
    update: false

- name: Initialize password store
  ansible.builtin.command:
    argv:
      - pass
      - init
      - "{{ pass_gpg_id }}"
    creates: "{{ pass_store_dir }}/.gpg-id"

- name: Save subtitle credentials
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/save-secrets.py"
    creates: "{{ lookup('env', 'HOME') }}/.secrets.sh"

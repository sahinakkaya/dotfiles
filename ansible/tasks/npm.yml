---
- name: Set up Node and npm for the current user
  become: false
  block:
    - name: Install nvm
      ansible.builtin.import_tasks: nvm.yml

    - name: Find the default Node executable
      ansible.builtin.shell: |
        source "$NVM_DIR/nvm.sh" --no-use
        nvm which default
      args:
        executable: /bin/bash
      environment:
        NVM_DIR: "{{ nvm_dir }}"
      register: npm_node_path
      changed_when: false
      when: not ansible_check_mode

    - name: Install global npm packages in the user's Node installation
      community.general.npm:
        name: "{{ item }}"
        executable: "{{ npm_node_path.stdout | dirname }}/npm"
        global: true
        state: present
      environment:
        PATH: "{{ npm_node_path.stdout | dirname }}:{{ lookup('env', 'PATH') }}"
      loop: "{{ npm_global_packages }}"
      when: not ansible_check_mode

# Source of truth for Kitty mappings and the prefix guide.
# See KEYBINDINGS.md for the format. Reload Kitty after editing.
version = 1

[settings]
kitty_mod = "alt+shift+cmd+ctrl"
map_timeout = 0
show_delay = 0.35
clear_all_shortcuts = true

[aliases]
kitty_scrollback_nvim = "kitten $HOME/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py"
launch_tab = "launch --type=tab --cwd=current"

[[modes]]
name = "kitty_prefix"
key = "f18"
timeout = 0

[prefixes]
b = "Background opacity"
f = "Font"
t = "Tabs"
g = "Extras"
"g>s" = "Scrollback"
"g>w" = "Create panes"
";" = "Kitty commands"
";>c" = "Clipboard and selection"
";>s" = "Scrollback and command output"
";>s>o" = "Command output"
";>w" = "Panes"
";>w>f" = "Focus a pane"
";>o" = "OS windows and application"
";>o>m" = "macOS window controls"
";>f" = "Fonts and colors"
";>i" = "Insert files and paths"
";>k" = "Configuration and documentation"
";>x" = "Terminal clearing and mouse actions"
";>c>b" = "Copy and paste buffers"
";>s>p" = "Shell prompt position"
";>w>c" = "Close panes"
";>w>m" = "Move and detach panes"
";>w>r" = "Resize panes"
";>t" = "Tabs"
";>l" = "Layouts"
";>m" = "Markers"
";>r" = "Sessions"
";>d" = "Debugging"
";>a" = "Advanced commands"
";>x>m" = "Mouse pointer actions"
i = "Copy text"
o = "Open text"
y = "Copy to clipboard"

[[groups]]
name = "Global"
mode = ""

[[groups.actions]]
name = "Open prefix shortcut guide"
bindings = [
  { keys = ["f18"], action = "kitten which_key.py" },
]

[[groups.actions]]
name = "Open editor in a new tab"
bindings = [
  { keys = ["f1"], action = "launch_tab ${EDITOR}" },
]

[[groups]]
name = "Clipboard"
mode = ""

[[groups.actions]]
name = "Copy selection or interrupt"
bindings = [
  { keys = ["ctrl+c"], action = "copy_and_clear_or_interrupt" },
]

[[groups.actions]]
name = "Copy to clipboard"
bindings = [
  { keys = ["cmd+c"], action = "copy_to_clipboard" },
]

[[groups.actions]]
name = "Paste from clipboard"
bindings = [
  { keys = ["cmd+v"], action = "paste_from_clipboard" },
]

[[groups]]
name = "Pane navigation"
mode = ""

[[groups.actions]]
name = "Focus pane or navigate in Vim"
keys_label = "ctrl+hjkl"
bindings = [
  { keys = ["ctrl+h"], label = "Left", action = "kitten pass_keys.py neighboring_window left   ctrl+h" },
  { keys = ["ctrl+j"], label = "Down", action = "kitten pass_keys.py neighboring_window bottom ctrl+j" },
  { keys = ["ctrl+k"], label = "Up", action = "kitten pass_keys.py neighboring_window top    ctrl+k" },
  { keys = ["ctrl+l"], label = "Right", action = "kitten pass_keys.py neighboring_window right  ctrl+l" },
]

[[groups]]
name = "Tabs"
mode = ""

[[groups.actions]]
name = "Return to previous tab"
bindings = [
  { keys = ["ctrl+s>'"], action = "goto_tab -1" },
]

[[groups]]
name = "Prefix"
mode = "kitty_prefix"

[[groups.actions]]
name = "Close shortcut guide"
bindings = [
  { keys = ["escape", "f18"], action = "pop_keyboard_mode" },
]

[[groups.actions]]
name = "Search all Kitty actions"
bindings = [
  { keys = ["/"], action = "combine : pop_keyboard_mode : command_palette" },
]

[[groups]]
name = "Clipboard"
mode = "kitty_prefix"

[[groups.actions]]
name = "Paste from clipboard"
bindings = [
  { keys = ["v"], action = "combine : pop_keyboard_mode : paste_from_clipboard", show = false },
]

[[groups]]
name = "Scrolling"
mode = "kitty_prefix"

[[groups.actions]]
name = "Scroll lines"
bindings = [
  { keys = ["g>s>j"], label = "Down", action = "scroll_line_down" },
  { keys = ["g>s>k"], label = "Up", action = "scroll_line_up" },
]

[[groups.actions]]
name = "Scroll pages"
bindings = [
  { keys = ["d", "page_down"], label = "Down", action = "scroll_page_down" },
  { keys = ["u", "page_up"], label = "Up", action = "scroll_page_up" },
]

[[groups.actions]]
name = "Jump to start or end of scrollback"
bindings = [
  { keys = ["home"], label = "Start", action = "scroll_home" },
  { keys = ["end"], label = "End", action = "scroll_end" },
]

[[groups.actions]]
name = "Jump between shell prompts"
bindings = [
  { keys = ["g>s>z"], label = "Previous", action = "scroll_to_prompt -1" },
  { keys = ["g>s>x"], label = "Next", action = "scroll_to_prompt 1" },
]

[[groups.actions]]
name = "Open scrollback in Neovim"
bindings = [
  { keys = ["g>s>h"], action = "combine : pop_keyboard_mode : kitty_scrollback_nvim" },
]

[[groups.actions]]
name = "Open last command output in Neovim"
bindings = [
  { keys = ["g>s>g"], action = "combine : pop_keyboard_mode : kitty_scrollback_nvim --config ksb_builtin_last_cmd_output" },
]

[[groups]]
name = "Panes"
mode = "kitty_prefix"

[[groups.actions]]
name = "Split current pane"
bindings = [
  { keys = ["c"], label = "Side by side", action = "combine : pop_keyboard_mode : launch --cwd=current --location=vsplit" },
  { keys = ["shift+c"], label = "Above and below", action = "combine : pop_keyboard_mode : launch --cwd=current --location=hsplit" },
]

[[groups.actions]]
name = "Create a pane"
bindings = [
  { keys = ["g>w>b"], label = "Next to current", action = "combine : pop_keyboard_mode : launch --location=neighbor" },
  { keys = ["g>w>f"], label = "First position", action = "combine : pop_keyboard_mode : launch --location=first" },
]

[[groups.actions]]
name = "Close current pane"
bindings = [
  { keys = ["q"], action = "combine : pop_keyboard_mode : close_window", show=false },
]

[[groups.actions]]
name = "Move current pane"
bindings = [
  { keys = ["."], label = "Forward", action = "move_window_forward" },
  { keys = [","], label = "Backward", action = "move_window_backward" },
]

[[groups.actions]]
name = "Move pane to first position"
bindings = [
  { keys = ["a"], action = "combine : pop_keyboard_mode : move_window_to_top" },
]

[[groups.actions]]
name = "Resize pane or resize in Vim"
keys_label = "ctrl+hjkl"
bindings = [
  { keys = ["ctrl+h"], label = "Left", action = "kitten pass_keys.py relative_resize left  3 alt+h" },
  { keys = ["ctrl+j"], label = "Down", action = "kitten pass_keys.py relative_resize down  3 alt+j" },
  { keys = ["ctrl+k"], label = "Up", action = "kitten pass_keys.py relative_resize up    3 alt+k" },
  { keys = ["ctrl+l"], label = "Right", action = "kitten pass_keys.py relative_resize right 3 alt+l" },
]

[[groups.actions]]
name = "Choose a pane to focus"
bindings = [
  { keys = ["s"], action = "combine : pop_keyboard_mode : focus_visible_window" },
]

[[groups.actions]]
name = "Choose a pane to swap with"
bindings = [
  { keys = ["ctrl+s"], action = "combine : pop_keyboard_mode : swap_with_window" },
]

[[groups]]
name = "Tabs"
mode = "kitty_prefix"

[[groups.actions]]
name = "Switch tabs"
bindings = [
  { keys = ["n"], label = "Next", action = "next_tab", show=false, repeat_timeout=0.6 },
  { keys = ["p"], label = "Previous", action = "previous_tab", show=false, repeat_timeout=0.6 },
]

[[groups.actions]]
name = "Create a tab"
bindings = [
  { keys = ["t>t"], label = "Beside current", action = "combine : pop_keyboard_mode : new_tab !neighbor" },
  { keys = ["t>n"], label = "At the end", action = "combine : pop_keyboard_mode : new_tab" },
]

[[groups.actions]]
name = "Close current tab"
bindings = [
  { keys = ["t>q"], action = "combine : pop_keyboard_mode : close_tab" },
]

[[groups.actions]]
name = "Move current tab"
bindings = [
  { keys = ["t>."], label = "Forward", action = "move_tab_forward" },
  { keys = ["t>,"], label = "Backward", action = "move_tab_backward" },
]

[[groups.actions]]
name = "Rename current tab"
bindings = [
  { keys = ["t>r"], action = "combine : pop_keyboard_mode : set_tab_title" },
]

[[groups.actions]]
name = "Return to previous tab"
bindings = [
  { keys = ["tab"], action = "combine : pop_keyboard_mode : goto_tab -1" },
]

[[groups.actions]]
name = "Go to tab 1–9"
keys_label = "1–9"
bindings = [
  { keys = ["1"], action = "combine : pop_keyboard_mode : goto_tab 1" },
  { keys = ["2"], action = "combine : pop_keyboard_mode : goto_tab 2" },
  { keys = ["3"], action = "combine : pop_keyboard_mode : goto_tab 3" },
  { keys = ["4"], action = "combine : pop_keyboard_mode : goto_tab 4" },
  { keys = ["5"], action = "combine : pop_keyboard_mode : goto_tab 5" },
  { keys = ["6"], action = "combine : pop_keyboard_mode : goto_tab 6" },
  { keys = ["7"], action = "combine : pop_keyboard_mode : goto_tab 7" },
  { keys = ["8"], action = "combine : pop_keyboard_mode : goto_tab 8" },
  { keys = ["9"], action = "combine : pop_keyboard_mode : goto_tab 9" },
]

[[groups]]
name = "Layouts"
mode = "kitty_prefix"

[[groups.actions]]
name = "Cycle pane layouts"
bindings = [
  { keys = ["space"], action = "next_layout" },
]

[[groups.actions]]
name = "Return to previous layout"
bindings = [
  { keys = ["shift+space", "ctrl+space"], action = "combine : pop_keyboard_mode : last_used_layout" },
]

[[groups.actions]]
name = "Toggle zoomed pane (stack layout)"
bindings = [
  { keys = ["m"], action = "combine : pop_keyboard_mode : toggle_layout stack", show=false },
]

[[groups]]
name = "Font"
mode = "kitty_prefix"

[[groups.actions]]
name = "Adjust font size"
bindings = [
  { keys = ["f>equal", "f>plus", "f>kp_add"], label = "Larger", action = "change_font_size all +0.5" },
  { keys = ["f>minus", "f>kp_subtract"], label = "Smaller", action = "change_font_size all -0.5" },
]

[[groups.actions]]
name = "Reset font size"
bindings = [
  { keys = ["f>0"], action = "combine : pop_keyboard_mode : change_font_size all 0" },
]

[[groups]]
name = "Open text"
mode = "kitty_prefix"

[[groups.actions]]
name = "Choose and open a URL"
bindings = [
  { keys = ["o>u"], action = "combine : pop_keyboard_mode : open_url_with_hints" },
]

[[groups.actions]]
name = "Open a path"
bindings = [
  { keys = ["o>f"], action = "combine : pop_keyboard_mode : kitten hints --type path" },
]

[[groups.actions]]
name = "Open a file at a line number"
bindings = [
  { keys = ["o>n"], action = "combine : pop_keyboard_mode : kitten hints --type linenum" },
]

[[groups.actions]]
name = "Open a hyperlink"
bindings = [
  { keys = ["o>h", "o>l"], action = "combine : pop_keyboard_mode : kitten hints --type hyperlink" },
]

[[groups]]
name = "Copy text"
mode = "kitty_prefix"

[[groups.actions]]
name = "Copy a path"
bindings = [
  { keys = ["i>f"], action = "combine : pop_keyboard_mode : kitten hints --type path --alphabet hjklfdsagtyrueiwoqpbnvmcxz1234567890 --program -" },
]

[[groups.actions]]
name = "Copy a line"
bindings = [
  { keys = ["i>l"], action = "combine : pop_keyboard_mode : kitten hints --type line --program -" },
]

[[groups.actions]]
name = "Copy a word"
bindings = [
  { keys = ["i>w"], action = "combine : pop_keyboard_mode : kitten hints --type word --program -" },
]

[[groups.actions]]
name = "Copy a hash"
bindings = [
  { keys = ["i>h"], action = "combine : pop_keyboard_mode : kitten hints --type hash --program -" },
]

[[groups]]
name = "Copy to clipboard"
mode = "kitty_prefix"

[[groups.actions]]
name = "Copy a hash to clipboard"
bindings = [
  { keys = ["y>h"], action = "combine : pop_keyboard_mode : kitten hints --type hash --program @" },
]

[[groups]]
name = "Terminal"
mode = "kitty_prefix"

[[groups.actions]]
name = "Insert a Unicode character"
bindings = [
  { keys = ["shift+u"], action = "combine : pop_keyboard_mode : kitten unicode_input" },
]

[[groups.actions]]
name = "Open Kitty debug shell"
bindings = [
  { keys = ["shift+escape"], action = "combine : pop_keyboard_mode : kitty_shell window" },
]

[[groups.actions]]
name = "Reset terminal and clear scrollback"
bindings = [
  { keys = ["delete", "backspace"], action = "combine : pop_keyboard_mode : clear_terminal reset active" },
]

[[groups.actions]]
name = "Clear screen (send Ctrl+L)"
bindings = [
  { keys = ["l"], action = "combine : pop_keyboard_mode : send_key ctrl+l" },
]

[[groups]]
name = "Appearance"
mode = "kitty_prefix"

[[groups.actions]]
name = "Adjust background opacity"
bindings = [
  { keys = ["b>i"], label = "More opaque", action = "set_background_opacity +0.1", repeat_timeout = 1.0 },
  { keys = ["b>d"], label = "More transparent", action = "set_background_opacity -0.1", repeat_timeout = 1.0 },
]

[[groups.actions]]
name = "Make background fully opaque"
bindings = [
  { keys = ["b>f"], action = "combine : pop_keyboard_mode : set_background_opacity 1" },
]

[[groups.actions]]
name = "Reset background opacity"
bindings = [
  { keys = ["b>r"], action = "combine : pop_keyboard_mode : set_background_opacity default" },
]

[[mouse]]
name = "Select text or follow link"
gesture = "left click ungrabbed"
action = "mouse_handle_click selection link prompt"

[[mouse]]
name = "Select command output"
gesture = "right press ungrabbed"
action = "mouse_select_command_output"

[[mouse]]
name = "Open selected command output in Neovim"
gesture = "kitty_mod+right press ungrabbed"
action = "combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output"


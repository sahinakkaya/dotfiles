# Right Command shortcuts. Character layout remains in XKB.
# Keymapper uses physical key names, before XKB's altwin remapping.
@forward-modifiers Shift Control Alt
# Keep external ANSI keyboards on their existing input path.
@skip-device /.*/
@grab-device "Apple MTP keyboard"

[class = /^(kitty|net\.kovidgoyal\.kitty)$/i]
# Emit once per press, matching Karabiner's repeat=false.
MetaRight >> F18^

[class = /^(zen|zen-browser|app\.zen_browser\.zen|app\.zen-browser\.zen)$/i]
# Specific chords precede the generic modifier mapping.
MetaRight{J} >> ControlLeft{Tab}
MetaRight{K} >> (ControlLeft ShiftLeft){Tab}
MetaRight >> (ControlLeft AltLeft MetaLeft)

[class != /^(kitty|net\.kovidgoyal\.kitty|zen|zen-browser|app\.zen_browser\.zen|app\.zen-browser\.zen)$/i]
MetaRight >> (ControlLeft AltLeft MetaLeft)
